# =================================================================================
# ======== ros_control 控制器配置文件，用于定义加载哪些控制器以及它们的参数 ========
# =================================================================================

# --- 关节状态控制器 ---
# 这个控制器是必需的，它会读取所有关节的当前状态（位置、速度、力），
# 然后发布到 /joint_states 话题上，供 robot_state_publisher 等节点使用。
joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50

# --- 底盘差分驱动控制器 ---
# 这个控制器订阅 /cmd_vel (geometry_msgs/Twist) 话题，
# 并根据接收到的线速度和角速度指令，计算出左右轮的速度，从而控制底盘移动。
diff_drive_controller:
  type: "diff_drive_controller/DiffDriveController"
  left_wheel: 'left_wheel_joint'   # 左轮关节名
  right_wheel: 'right_wheel_joint' # 右轮关节名
  publish_rate: 50
  
  # --- 物理参数 ---
  # 【重要】: 下面的轮距和轮子半径需要您根据实际模型测量后填写，否则运动会不准确！
  wheel_separation: 0.5274  # 两个轮子中心之间的距离 (单位: 米)
  wheel_radius: 0.085       # 轮子的半径 (单位: 米)

  # --- 指令超时 ---
  # 如果在 0.5 秒内没有收到新的 /cmd_vel 消息，则停止机器人
  cmd_vel_timeout: 0.5

  # --- TF坐标变换 ---
  # 是否发布 odom -> base_link 的 TF 变换
  enable_odom_tf: true
  base_frame_id: 'base_link' # 机器人基座的 frame id
  odom_frame_id: 'odom'      # 里程计的 frame id


# --- 机械臂关节轨迹控制器 ---
# 这个控制器用于控制机械臂的六个关节，使其能够执行一条平滑的运动轨迹。
# 它通常会订阅一个 action 话题 (如 /follow_join_trajectory)。
arm_controller:
  type: "effort_controllers/JointTrajectoryController" # 类型要与 transmission 中的接口匹配
  
  # 要控制的关节列表，顺序必须正确
  joints:
    - ur_arm_shoulder_pan_joint
    - ur_arm_shoulder_lift_joint
    - ur_arm_elbow_joint
    - ur_arm_wrist_1_joint
    - ur_arm_wrist_2_joint
    - ur_arm_wrist_3_joint

  # --- PID 参数 ---
  # 【重要】: PID 参数需要根据实际仿真效果进行调试（调参），以下为初始值。
  gains:
    ur_arm_shoulder_pan_joint:  {p: 100.0, i: 0.01, d: 10.0}
    ur_arm_shoulder_lift_joint: {p: 100.0, i: 0.01, d: 10.0}
    ur_arm_elbow_joint:         {p: 100.0, i: 0.01, d: 10.0}
    ur_arm_wrist_1_joint:       {p: 50.0, i: 0.005, d: 5.0}
    ur_arm_wrist_2_joint:       {p: 50.0, i: 0.005, d: 5.0}
    ur_arm_wrist_3_joint:       {p: 50.0, i: 0.005, d: 5.0}

  # --- 运动约束 ---
  # 可以设置每个关节的目标容差等
  constraints:
    goal_time: 0.6