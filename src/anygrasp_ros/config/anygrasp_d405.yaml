# Workspace coordinates are interpreted in the actual input PointCloud2 frame.
# The verified live stream currently uses d405_depth_optical_frame.
cloud_topic: /d405/depth/color/points
best_grasp_topic: /anygrasp/best_grasp
marker_topic: /anygrasp/grasp_markers
input_cloud_topic: /anygrasp/input_cloud
publish_input_cloud: true

python_executable: /home/jt001/.conda/envs/anygrasp/bin/python
sdk_dir: /home/jt001/anygrasp_sdk/grasp_detection
checkpoint_path: /home/jt001/anygrasp_sdk/grasp_detection/log/checkpoint_detection.tar

top_n: 10
inference_rate: 0.2
min_workspace_points: 1000

statistical_outlier_filter:
  enabled: true
  nb_neighbors: 20
  std_ratio: 2.0

workspace:
  x_min: -0.28
  x_max: 0.3
  y_min: -0.3
  y_max: 0.03
  z_min: 0.18
  z_max: 0.35

# Keep these aligned with the already validated demo.py invocation and defaults.
max_gripper_width: 0.1
gripper_height: 0.03
top_down_grasp: true
debug: true
voxel_size: 0.005
apply_object_mask: true
dense_grasp: false
collision_detection: true
