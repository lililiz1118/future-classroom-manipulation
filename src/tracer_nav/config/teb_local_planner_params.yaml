TebLocalPlannerROS:
  odom_topic: localization_speed
  map_frame: map

  teb_autosize: true
  dt_ref: 0.35
  dt_hysteresis: 0.15
  min_samples: 3
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 1.3
  global_plan_prune_distance: 1.0
  global_plan_viapoint_sep: 0.8
  feasibility_check_no_poses: 3
  publish_feedback: false

  shrink_horizon_backup: true
  oscillation_recovery: true

  max_vel_x: 0.35
  max_vel_x_backwards: 0.0
  max_vel_theta: 0.45
  acc_lim_x: 0.4
  acc_lim_theta: 0.6
  min_turning_radius: 0.0
  cmd_angle_instead_rotvel: false

  footprint_model:
    type: "polygon"
    vertices: [[0.38, 0.31], [0.38, -0.31], [-0.38, -0.31], [-0.38, 0.31]]

  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.20
  free_goal_vel: false
  complete_global_plan: true

  min_obstacle_dist: 0.12
  inflation_dist: 0.35
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.5
  obstacle_poses_affected: 6
  costmap_converter_plugin: ""

  no_inner_iterations: 3
  no_outer_iterations: 2
  penalty_epsilon: 0.10
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 1.0
  weight_optimaltime: 1
  weight_shortest_path: 0
  weight_obstacle: 25.0
  weight_inflation: 0.15
  weight_viapoint: 1.5
  weight_adapt_factor: 2.0

  # Full homotopy planning overloaded the 10 Hz control loop on the real map.
  enable_homotopy_class_planning: false
  enable_multithreading: true
