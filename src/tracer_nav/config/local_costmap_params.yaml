local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  rolling_window: true
  width: 5.0
  height: 5.0
  resolution: 0.05
  transform_tolerance: 0.5
  footprint: [[0.38, 0.31], [0.38, -0.31], [-0.38, -0.31], [-0.38, 0.31]]

  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  obstacle_layer:
    enabled: true
    footprint_clearing_enabled: true
    observation_sources: laser_mark laser_clear
    laser_mark:
      topic: /scan
      sensor_frame: base_link
      data_type: LaserScan
      marking: true
      clearing: false
      observation_persistence: 2.0
      obstacle_range: 4.5
      min_obstacle_height: -1.0
      max_obstacle_height: 2.0
      expected_update_rate: 0.5
    laser_clear:
      topic: /scan
      sensor_frame: base_link
      data_type: LaserScan
      marking: false
      clearing: true
      raytrace_range: 5.5
      inf_is_valid: true
      min_obstacle_height: -1.0
      max_obstacle_height: 2.0
      expected_update_rate: 0.5

  inflation_layer:
    inflation_radius: 0.55
    cost_scaling_factor: 2.2
